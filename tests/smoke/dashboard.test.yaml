# yaml-language-server: $schema=../../schema/test-file.schema.json
suite: Dashboard
tier: smoke
tags: [dashboard]

tests:
  - name: opens the dashboard with its sidebar and no errors
    steps:
      - goto: /dashboard
      # The app shell rendered (not a login page or an error screen): its sidebar navigation.
      - expect_visible: { role: link, name: Home, nth: 0 }
      - expect_no_errors: true
