# yaml-language-server: $schema=../../schema/test-file.schema.json
suite: Asset — add through the UI (manual)
tier: regression
tags: [assets, ui]

# Before each test: a fresh "[SMOKE] E2E …" course with one empty page (via the API, no credits),
# then resolve_asset checks the row's `ai` against the backend.
setup: [blank_course, resolve_asset]

each:
  as: asset
  from: data/assets-manual.yaml

tests:
  - name: adds ${asset.label} via the Add Asset modal
    timeout: 10m
    steps:
      - goto: ${course.edit_url}
      - expect_visible: { text: This page is empty }
      - add_asset_via_modal:
          label: ${asset.label}
          ai: ${asset.ai}
      - wait_asset: { type: "${asset.type}", timeout: 5m }
      - expect_asset:
          min_height: 100
          not_text: [Unknown component type]
          images_loaded: true
          timeout: 2m
      - expect_no_errors: true
      - ai_check: Does the ${asset.label} block show its default content rather than a blank box or an error?
