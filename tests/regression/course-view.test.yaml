# yaml-language-server: $schema=../../schema/test-file.schema.json
suite: Course — learner view
tier: regression
tags: [course, learner]

# A published two-page course with one Content Block on each page, built through the API
# (no AI, no credits) and deleted after the test.
setup: [published_course]

tests:
  - name: shows a published course page by page
    steps:
      - goto: ${course.pages.0.learner_url}
      - expect_visible: { css: "[data-asset-id]", nth: 0 }

      # The footer's next button sits after "Previous" and carries the next page's title.
      - expect:
          css: 'button:has-text("Previous") ~ button'
          contains: ${course.pages.1.title}
      - click: { css: 'button:has-text("Previous") ~ button' }

      - expect_url: { contains: "${course.pages.1.hash}" }
      - expect_visible: { css: "[data-asset-id]", nth: 0 }
