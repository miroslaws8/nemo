# yaml-language-server: $schema=../../../schema/skill-file.schema.json
# What this skill does; pnpm skills writes its SKILL.md (Hermes reads that) from this file.
description: >-
  Read-only navigation health check of the app's dashboard — log in and visit every main
  sidebar section, asserting each page loads without error. Safe on staging AND prod. Use to
  verify all routes are alive after a deploy, or as a synthetic uptime monitor.
title: Example app — navigation smoke (route health check)
summary: Check that every main dashboard section loads.
safety: read_only
start_at: /dashboard

steps:
  - Open `<base>/dashboard` and log in. Confirm Home rendered.
  - >-
    Enumerate the sidebar: collect every link via `document.querySelectorAll('a[href]')` then
    filter in JS/Python — do NOT rely on a container selector like `aside a, nav a` (it returned
    empty on prod). The sidebar varies by workspace/plan, so read it from the page you are on.
    Expand collapsible groups ("Build & Manage", "Workforce") to reveal sub-items (read-only).
    The anchor scan can miss top-level links (Home, Courses, Learning Paths, Shared with me) —
    if so, find them in a screenshot and check their routes directly.
  - >-
    Reference sections seen on staging (varies by account): Home (`/dashboard` itself),
    `courses`, `collections`, `learning-paths`, `share` (Shared with me), `quizzes`,
    `certificates`, `user-management`, `recently-deleted`, and the Workforce group `workforce` +
    sub-pages (`workforce/skill-gaps`, `/recommendations`, `/knowledge`, `/requests`,
    `/learners`, `/structure`, `/work-areas`, `/setup`, `/automation`, `/scales`, `/sign-off`).
    "Learning Settings" is a TOP-LEVEL route `<base>/learning-settings` (outside `/dashboard`).
    Micro-learning is NOT a route (a toggle on Home). `content-library` may be absent. A section
    missing from the sidebar is INFO (not a failure); only sections present-but-broken fail.
  - >-
    For each destination (batch ~5 navigations per call): navigate (click its link, else go to
    its href), read `js("location.href")`, let it settle, and record OK/FAIL. FAIL if:
    401/403/404/5xx, an error screen or `role=alert`, a genuinely blank/no-content page, a
    spinner with no content after ~8s, or a redirect back to login. Empty-state pages are OK.

screenshots:
  folder: nav
  files:
    - >-
      one per section: `01-home.png`, `02-courses.png`, …; always keep a failing section's
      shot

report:
  - >-
    a table, one row per section: `section | final URL | OK/FAIL | note`, broken sections
    first
  - environment and the number of sections checked
  - expected sections absent from the sidebar (INFO)
  - the screenshot folder
pass_if:
  - every section present in the sidebar loaded OK
fail_if:
  - a section present in the sidebar did not load (list the broken ones first)
not_a_failure:
  - a section missing from the sidebar (INFO)
  - an empty-state page
