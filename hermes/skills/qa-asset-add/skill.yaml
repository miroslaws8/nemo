# yaml-language-server: $schema=../../../schema/skill-file.schema.json
# What this skill does; pnpm skills writes its SKILL.md (Hermes reads that) from this file.
description: >-
  Per-asset FRONTEND test — adds ONE asset type to a fresh "[SMOKE] Asset Zoo UI" course THROUGH
  THE REAL UI (clicks Add asset -> picks the asset card -> toggles AI -> confirms), then waits
  for AI generation and confirms the asset renders on the page. Tests the frontend add flow
  (buttons, Add-Asset modal, AI toggle), not just the API. MUTATING + uses AI credits — runs on
  every env. Takes the asset type as the first argument, env as the second.
title: Example app — add an asset through the real UI (frontend add test)
summary: |-
  Tests the FRONTEND asset-add flow: the real **Add asset** button, the Add-Asset modal (search,
  asset cards, AI toggle, prompt), and the on-page generation/render — not just the API the
  asset-zoo builder hits directly. It creates a fresh blank course, opens its empty page in the
  builder's **EDIT** mode, adds one asset of the requested type by clicking through the UI
  exactly as an author would, then waits for AI generation and confirms the asset renders on the
  page.

  This is a SEPARATE course from the API-built `[SMOKE] Asset Zoo` render fixture. Never add via
  the UI into that render fixture — it would pollute it with duplicates.
safety: creates_data
ai_credits: true
side_effects: >-
  ONE fresh `[SMOKE] Asset Zoo UI` course per run, left in place (remove old ones by the
  `[SMOKE] Asset Zoo UI` title); the AI toggle defaults ON, so the asset is AI-generated
arguments: >-
  the asset type, a registry slug (`hero`, `cards`, `accordion`, `feature_grid`, `text_block`,
  ...; default `hero`), e.g. `hero staging`

rules:
  - Topic/prompt for generation = "Workplace fire safety for new employees".
  - >-
    The course scaffolding (blank course + one empty page) is created by a script, NOT through
    the browser — that scaffolding is setup, not what we are testing. The asset ADD itself is
    done entirely through the UI, and that is the test.

steps:
  - Resolve the asset type (default `hero`) and the environment (default `staging`) from the arguments.
  - |-
    **Create the fresh blank course** via the setup script (exec/bash, not the browser):
    ```
    cd ~/myqa-output && ZOO_BLANK_ONLY=1 node ~/.hermes/skills/qa-asset-zoo/scripts/build-asset-zoo.mjs <env>
    ```
    Parse the `ZOO_RESULT={...}` JSON line from stdout (also saved to
    `~/.hermes/asset-add-<env>.json`): note `edit_url`, `hub_id`, `title`, `page_id`.
    - Non-zero exit / no `ZOO_RESULT` → STOP: `RESULT: FAIL — could not create the blank course (<stage from the FAILED line>)`.
    - If it fails because Playwright deps are missing, one-time:
      `cd ~/.hermes/skills/qa-asset-zoo/scripts && pnpm install --frozen-lockfile && pnpm exec playwright install chromium`, then retry.
  - >-
    Log in per the shared contract, then open `edit_url` — the builder in **EDIT mode** (NO
    `?mode=preview`; preview is read-only and has no add buttons). Wait 5-8s. The empty page
    shows an empty-state card with an **Add asset** button (and the course title `[SMOKE] Asset
    Zoo UI …`). Screenshot `01-empty`.
  - >-
    **Open the Add-Asset modal**: click the button labelled **Add asset**
    (`builder.buttons.add_asset`). A modal titled **Add New Asset** (`asset_selector.title`)
    opens. If it doesn't open, retry once; still nothing → FAIL "modal didn't open".
  - |-
    **Pick the asset type.** The card's visible LABEL differs from the slug, and the search
    matches any card whose type *contains* the query — so searching a slug like `cards` shows
    several cards (`cards`, `flip_cards`, `image_flip_cards`, `strategy_cards`). To avoid
    guessing: look up the slug's exact card label in the table below, type that LABEL into the
    search box (placeholder "Search assets…", id `asset-search-input`), then click the single
    matching **card** (a button showing the label + an icon). Confirm by vision.

    | slug | card label to click |
    |---|---|
    | `text_block` | Text Block |
    | `content_block` | Content Block |
    | `hero` | Hero Section |
    | `cards` | Cards Grid |
    | `feature_grid` | Feature Grid |
    | `accordion` | Accordion |
    | `case_study` | Case Study |
    | `goals` | Goals |
    | `numbered_grid` | Numbered Grid |
    | `comparison_columns` | Comparison Columns |

    If the requested slug is NOT in this table, type the slug, click the card whose label most
    closely matches, and note in the report that the label↔slug mapping was inferred (so the
    table can be extended). Card not found → FAIL "card not found for <type>". Screenshot
    `02-modal` (asset selected, detail panel showing).

    (Labels come from the frontend asset registry — `assets-mock.ts` `name`, except
    `video_asset` which `ASSET_DISPLAY_NAME_KEYS` renames to "Video". Add a row when you expand
    the tested types.)
  - |-
    In the right **detail panel**:
    - Leave the **Generate this asset with AI** toggle ON (it defaults ON for AI-capable
      types). If the asset is manual-only the toggle is ABSENT — that's expected; it will add
      sample content instead of generating (note this in the report).
    - If a prompt textarea is shown, type the topic: `Workplace fire safety for new employees`.
  - >-
    **Confirm the add**: click the panel's **Add Asset** button (`asset_selector.add_asset`; it
    reads "Adding…" while busy). This is the button INSIDE the modal (the modal title is "Add New
    Asset"), not the page's "Add asset" button. The modal closes and the asset appears on the
    page in a generating/placeholder state. Screenshot `03-generating`.
  - >-
    **Wait for generation IN THE UI** (poll up to ~20 min): the placeholder/loader resolves into
    the rendered asset. Judge by RENDERED CONTENT (screenshot / visible text), not DOM class
    names (a lingering loader class can persist on a finished page).
  - |-
    **Verify the asset rendered**:
    - An asset block is present with real content, height > 0, and no "Unknown component type".
    - No error text on the page: search `document.body.innerText` for `404`, `403`, `401`,
      `500`, "something went wrong", "page not found".
    - Run `vision_analyze` on the asset screenshot to confirm real content (not a blank box or a
      stuck loader). Note it as visually confirmed. Screenshot `04-rendered`.

screenshots:
  folder: asset-add
  files:
    - "`<type>-01-empty.png`"
    - "`<type>-02-modal.png`"
    - "`<type>-03-generating.png`"
    - "`<type>-04-rendered.png`"

report:
  - environment; asset type; course title and `hub_id`
  - >-
    the UI flow, step by step: modal opened? card selected? AI toggle state (on / manual-only
    absent)? Add clicked + modal closed?
  - did the asset generate and render? (height + whether vision confirmed real content)
  - any error text found
  - absolute screenshot paths
  - >-
    side effects: a `[SMOKE] Asset Zoo UI` course was created and AI credits were used
pass_if:
  - >-
    the asset was added through the UI (modal → card → Add) and then rendered with real content
    on the page
fail_if:
  - >-
    anything else — name the failing step: blank-course setup, modal didn't open, card not found,
    Add didn't fire, generation failed, or it never rendered
