# yaml-language-server: $schema=../../../schema/skill-file.schema.json
# What this skill does; pnpm skills writes its SKILL.md (Hermes reads that) from this file.
description: >-
  Functional test of the course player — open a published course and verify its pages and
  assets render and page navigation works. Uses the learner view on every env (records
  progress). Use to check that published course content actually plays.
title: Example app — view a published course (player render check)
summary: >-
  Open a published course and confirm the player renders real content (the first page has a
  title + a content/asset block) and page navigation works.
safety: records_activity
side_effects: opening the learner view records learner progress for the test account
start_at: /dashboard/courses

rules:
  - >-
    All environments use the learner view, prod included (full prod parity):
    `<base>/hub/<hub_id>/course`.
  - >-
    Read-only within the course: view pages only — do NOT answer quizzes, click
    Complete/Finish, edit, or submit any form other than login. (Viewing records progress; that
    is fine. Completing the course is a separate, heavier action we don't trigger here.)

steps:
  - Log in and open `<base>/dashboard/courses`.
  - >-
    Find a **Published** course and get its `hub_id`. Clicking a course card as an admin opens
    the EDIT builder (not the player), so read the id from the card if exposed, or click it once
    to open `<base>/hub/<hub_id>/<chat_id>/ai-builder` and read `hub_id` from
    `js("location.href")`. If NO published course exists, STOP (not a failure):
    `RESULT: PASS — no published course to view (nothing to test)`.
  - "Open the learner player: `<base>/hub/<hub_id>/course`."
  - >-
    Verify the FIRST page rendered: a page/section title AND at least one visible content/asset
    block; not blank; no error / `role=alert` / 401/403/404/5xx; no stuck spinner.
  - >-
    If the course has more than one page, navigate to the NEXT page (page control / next — not
    "Complete") and verify it rendered too.
  - Note the asset/content types seen (text, image, dialog, quiz, etc.).

screenshots:
  folder: course
  files:
    - "`01-courses-list.png`"
    - "`02-course-page1.png`"
    - "`03-course-page2.png` (if present)"

report:
  - environment
  - course title and `hub_id`
  - pages verified and whether navigation worked
  - content/asset types seen
  - screenshot paths
  - "side effects: learner progress was recorded for the test account"
pass_if:
  - >-
    the player opened and the first page rendered real content (and next-page navigation worked
    when the course has more pages)
  - there was no published course
fail_if:
  - the player errors
  - a page is blank or shows an error
  - a loader never resolves
  - navigation is broken
