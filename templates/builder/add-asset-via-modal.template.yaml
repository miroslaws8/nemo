# yaml-language-server: $schema=../../schema/template-file.schema.json
template: add_asset_via_modal
title: add ${params.label} via the Add Asset modal
description: >-
  On an empty builder page: opens the Add Asset modal, picks the card by its name, fills the prompt
  when the type is AI-generated, and confirms.

params:
  label:
    type: string
    description: The card name in the modal (assets-mock.ts → name), e.g. Hero Section
  ai:
    type: boolean
    default: true
    description: Whether the type is AI-generated (it then has the AI toggle and a prompt)
  prompt:
    type: string
    default: Workplace fire safety for new employees
    description: What the AI should write about

steps:
  # By visible text: the chat panel's icon button has the same "Add asset" aria-label.
  - click: { text: Add asset }
  - expect_visible: { text: Add New Asset, in: dialog }

  - fill: { css: "#asset-search-input", value: "${params.label}" }
  - click: { button: "${params.label}", in: dialog }

  # AI types show the toggle (on by default) and a prompt; manual-only types have neither.
  - expect: { role: switch, in: dialog, checked: true }
    when: params.ai
  - expect_hidden: { role: switch, in: dialog }
    unless: params.ai
  - fill: { css: "#asset-prompt-input", value: "${params.prompt}" }
    when: params.ai

  - click: { button: Add Asset, in: dialog }
  - expect_hidden: { role: dialog }
