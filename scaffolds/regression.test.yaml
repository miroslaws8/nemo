# yaml-language-server: $schema=__SCHEMA_PATH__
# Regression tests may create data: name it ${test.data_title} (it starts with safety.data_prefix)
# and register what the UI creates with `- track: { kind, title }`, so it is deleted afterwards.
# Data made through the API before the test comes from a setup (`setup: [<name>]`); both need the
# app's own code (docs/guide.md → Setups, Test data and cleanup).
suite: __SUITE__
tier: regression
tags: []

tests:
  - name: works through the UI
    steps:
      - goto: /
      - expect_visible: { css: h1 }
      - expect_no_errors: true
