# yaml-language-server: $schema=__SCHEMA_PATH__
# Tests of the app's AI features: they spend its credits, so they run only after the smoke tier
# passes and are never retried. Give a slow generation a timeout of its own.
suite: __SUITE__
tier: ai
tags: []

tests:
  - name: generates an answer
    timeout: 10m
    steps:
      - goto: /
      - expect_visible: { css: h1 }
      - ai_check: Does the generated content make sense?
      - expect_no_errors: true
